<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculateur Kamas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Calculateur de Kamas</h1>
        <p class="subtitle">Upload une capture du chat pour additionner les montants</p>
        
        <div class="upload-zone" id="dropZone">
            <input type="file" id="fileInput" accept="image/*" hidden>
            <div class="upload-content">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p>Glisse une image ici ou clique pour upload</p>
            </div>
            <img id="preview" class="preview hidden" alt="Preview">
        </div>
        
        <button id="processBtn" class="btn-process hidden">Calculer les montants</button>
        
        <div id="results" class="results hidden">
            <div class="result-card total">
                <span class="label">Total</span>
                <span class="value" id="totalValue">0</span>
                <span class="unit">kamas</span>
            </div>
            
            <div class="amounts-list">
                <h3>Montants detectes</h3>
                <ul id="amountsList"></ul>
            </div>
            
            <details class="raw-text">
                <summary>Texte brut detecte</summary>
                <pre id="rawText"></pre>
            </details>
        </div>
        
        <div id="loader" class="loader hidden">
            <div class="spinner"></div>
            <p>Analyse en cours...</p>
        </div>
    </div>
    
    <script src="/static/app.js"></script>
</body>
</html>
